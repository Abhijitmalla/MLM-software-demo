<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VK Services Enterprises</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom gradient for the button */
        .btn-gradient {
            background: linear-gradient(90deg, #0f2042 0%, #0f2042 50%, #f95722 100%);
        }
        .btn-gradient:hover {
            opacity: 0.95;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-0 m-0">

    <!-- Outer Container / Background Image Wrapper (justify-start aligns the card to the LEFT) -->
    <div class="relative w-full min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-start px-4 sm:px-8 lg:px-20 py-8" 
         style="background-image: url('../assets/login-image.png');">

        <!-- Login Form Card (Positioned on the Left) -->
        <div class="w-full max-w-[460px] bg-white/95 backdrop-blur-md rounded-2xl p-8 sm:p-10 shadow-2xl my-auto z-10">
            
            <!-- Logo Section -->
            <div class="flex flex-col items-center mb-6">
                <div class="flex items-center gap-2">
                    <!-- Brand VK Icon/Logo representation -->
                    <div class="relative flex items-center justify-center font-bold text-2xl text-[#0f2042]">
                        <span class="text-3xl font-black tracking-tighter text-[#0f2042]">V</span>
                        <span class="text-3xl font-black tracking-tighter text-[#f95722] -ml-1">K</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg leading-tight tracking-wider text-[#0f2042]">VK SERVICES</span>
                        <span class="text-[10px] tracking-[0.25em] font-medium text-gray-500 -mt-1">ENTERPRISES</span>
                    </div>
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-[#0f2042]">
                    Login to <span class="text-[#f95722]">Your Account</span>
                </h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-2 leading-snug">
                    Access your dashboard and manage your MLM business with ease.
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                
                <!-- Input: Mobile / Email -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input 
                        type="text" 
                        id="identifier" 
                        required 
                        placeholder="Mobile No. / Email" 
                        value="admin@vkservices.com"
                        class="w-full bg-slate-50 border border-slate-200 text-gray-800 text-sm rounded-lg pl-10 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white transition-all placeholder-gray-400"
                    >
                </div>

                <!-- Input: Password -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        placeholder="Password" 
                        class="w-full bg-slate-50 border border-slate-200 text-gray-800 text-sm rounded-lg pl-10 pr-10 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-900 focus:bg-white transition-all placeholder-gray-400"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-gray-600 focus:outline-none"
                    >
                        <i id="toggleIcon" class="fa-regular fa-eye-slash text-sm"></i>
                    </button>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer text-gray-600">
                        <input type="checkbox" class="w-4 h-4 rounded text-blue-900 focus:ring-blue-800 border-gray-300">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="text-[#f95722] hover:underline font-medium">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="btn-gradient w-full text-white font-medium py-3 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2 mt-4"
                >
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- OR Divider -->
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-xs font-semibold text-gray-400">OR</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Google Sign In -->
            <button 
                type="button" 
                onclick="handleGoogleLogin()" 
                class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-gray-600 font-medium text-xs sm:text-sm py-3 rounded-lg flex items-center justify-center space-x-2 transition-all"
            >
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <!-- Bottom Link -->
            <div class="text-center mt-6 text-xs text-gray-500">
                New to VK Services? 
                <a href="#" class="text-[#f95722] font-semibold hover:underline inline-flex items-center gap-1">
                    Contact Us <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
            </div>

        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }

        // Form Submit Handler
        function handleLogin(event) {
            event.preventDefault();
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            console.log('Logging in with:', { identifier, password });
            alert('Login submitted for: ' + identifier);
        }

        // Google OAuth Placeholder
        function handleGoogleLogin() {
            alert('Redirecting to Google authentication...');
        }
    </script>
</body>
</html>
