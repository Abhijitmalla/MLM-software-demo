  <!-- ========== SCRIPTS ========== -->
  <script>
    lucide.createIcons();

    function toggleDropdown(id) {
      const targetMenu = document.getElementById(id);
      const targetIcon = document.getElementById('icon-' + id);
      document.querySelectorAll('.sidebar-dropdown > div').forEach(el => {
        if (el.id !== id && !el.classList.contains('hidden')) {
          el.classList.add('hidden');
          const otherIcon = document.getElementById('icon-' + el.id);
          if (otherIcon) otherIcon.style.transform = 'rotate(0deg)';
        }
      });
      if (targetMenu.classList.contains('hidden')) {
        targetMenu.classList.remove('hidden');
        if (targetIcon) targetIcon.style.transform = 'rotate(180deg)';
      } else {
        targetMenu.classList.add('hidden');
        if (targetIcon) targetIcon.style.transform = 'rotate(0deg)';
      }
    }

    let isSidebarCollapsed = false;
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const textElements = document.querySelectorAll('.sidebar-text');
      isSidebarCollapsed = !isSidebarCollapsed;
      if (isSidebarCollapsed) {
        sidebar.classList.remove('w-80');
        sidebar.classList.add('w-20');
        textElements.forEach(el => el.classList.add('hidden'));
      } else {
        sidebar.classList.remove('w-20');
        sidebar.classList.add('w-80');
        textElements.forEach(el => el.classList.remove('hidden'));
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const themeIcon = document.getElementById('themeIcon');
      if (isDark) themeIcon.setAttribute('data-lucide', 'sun');
      else themeIcon.setAttribute('data-lucide', 'moon');
      lucide.createIcons();
    }
  </script>
