    <script>
        document.getElementById('sideNav').innerHTML = `<p class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 sidebar-text">Dashboards</p><div class="space-y-1"><a href="../index.html" class="nav-link"><i data-lucide="bar-chart-2"></i><span>Dashboard</span></a><div class="sidebar-dropdown"><button onclick="toggleDropdown('admin-menu')" class="nav-button"><span><i data-lucide="shopping-bag"></i>Admin &amp; Rights</span><i data-lucide="chevron-down" id="icon-admin-menu"></i></button><div id="admin-menu" class="submenu hidden"><a href="../admin-table.html">Admin Table</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('associate-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Associate</span><i data-lucide="chevron-down" id="icon-associate-menu"></i></button><div id="associate-menu" class="submenu hidden"><a href="../all-associates.html">All Associate</a><a href="../active-associate.html">Active Associate</a><a href="../inactive-associate.html">Inactive Associate</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('activation-menu')" class="nav-button"><span><i data-lucide="home"></i>Activation History</span><i data-lucide="chevron-down" id="icon-activation-menu"></i></button><div id="activation-menu" class="submenu hidden"><a href="../activation-history.html">Activation History</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('kyc-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>KYC</span><i data-lucide="chevron-down" id="icon-kyc-menu"></i></button><div id="kyc-menu" class="submenu hidden"><a href="../kyc/kyc-pending.html">Pending Request</a><a href="../kyc/kyc-accepted.html">Accepted Request</a><a href="../kyc/kyc-rejected.html">Rejected Request</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('report-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Report</span><i data-lucide="chevron-down" id="icon-report-menu"></i></button><div id="report-menu" class="submenu hidden"><a href="../report/autopool-table.html">Autopool Table</a><a href="../report/tds-charge-report.html">TDS Charge Report</a><a href="../report/repurchase-report.html">Repurchase Report</a><a href="../report/consistency-report.html">Consistency Report</a><a href="../report/early-bird-report.html">Early Bird Report</a><a href="../report/achievement-report.html">Achievement Report</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('fund-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Fund Request</span><i data-lucide="chevron-down" id="icon-fund-menu"></i></button><div id="fund-menu" class="submenu hidden"><a href="../fund-request/pending-request.html">Pending Request</a><a href="../fund-request/accepted-request.html">Accepted Request</a><a href="../fund-request/Rejected-request.html">Rejected Request</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('transaction-menu')" class="nav-button bg-brand-dark text-white"><span><i data-lucide="layout-grid"></i>Fund Transaction</span><i data-lucide="chevron-down" id="icon-transaction-menu" class="rotate-180"></i></button><div id="transaction-menu" class="submenu"><a href="./fund-transfer.html">Fund Transfer</a><a href="./admin-credit-history.html" class="text-brand-dark dark:text-brand-light font-semibold">Admin Credit History</a><a href="./admin-debit-history.html">Admin Debit History</a></div></div><div class="sidebar-dropdown"><button onclick="window.location.href='../generated-payout.html'" class="nav-button"><span><i data-lucide="layout-grid"></i>Generated Payout</span></button></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('withdrawal-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Withdrawal Request</span><i data-lucide="chevron-down" id="icon-withdrawal-menu"></i></button><div id="withdrawal-menu" class="submenu hidden"><a href="../withdrawal-request/processing-request.html">Processing Request</a><a href="../withdrawal-request/accepted-request.html">Accepted Request</a><a href="../withdrawal-request/rejected-request.html">Rejected Request</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('notification-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Notification</span><i data-lucide="chevron-down" id="icon-notification-menu"></i></button><div id="notification-menu" class="submenu hidden"><a href="#">Add Model/Banner News</a><a href="#">Add Notification</a><a href="../notification/add-qr-code.html">Add QR Code</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('package-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Activation Packages</span><i data-lucide="chevron-down" id="icon-package-menu"></i></button><div id="package-menu" class="submenu hidden"><a href="../Activation-package/manage-package.html">Manage Package Type</a><a href="../Activation-package/add-package-kit.html">Add Package Kit</a><a href="../Activation-package/manage-package-kit.html">Manage Package Kit</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('setting-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Admin Setting</span><i data-lucide="chevron-down" id="icon-setting-menu"></i></button><div id="setting-menu" class="submenu hidden"><a href="../admin-setting/withdrawal-setting.html">Withdrawal Settings</a><a href="../admin-setting/onetime-setting.html">Onetime Setting</a><a href="../admin-setting/autopool-setting.html">Autopool Setting</a><a href="../admin-setting/repurchase-setting.html">Repurchase Setting</a><a href="../admin-setting/fast-track-benifit-setting.html">Fast Track Benifit Setting</a><a href="../admin-setting/achievement-benifit-setting.html">Achievement Benifit Setting</a><a href="../admin-setting/consistency-benifit-setting.html">Consistency Benifit Setting</a><a href="../admin-setting/early-bird-benifit-setting.html">Early Bird Benifit Setting</a></div></div><div class="sidebar-dropdown"><button onclick="toggleDropdown('support-menu')" class="nav-button"><span><i data-lucide="layout-grid"></i>Support</span><i data-lucide="chevron-down" id="icon-support-menu"></i></button><div id="support-menu" class="submenu hidden"><a href="../support/inbox.html">Inbox</a><a href="../support/outbox.html">Outbox</a></div></div><button class="nav-button"><span><i data-lucide="log-out"></i>Logout</span></button></div>`;
        function toggleDropdown(id){const menu=document.getElementById(id),icon=document.getElementById('icon-'+id);document.querySelectorAll('.sidebar-dropdown > .submenu').forEach(item=>{if(item.id!==id&&!item.classList.contains('hidden')){item.classList.add('hidden');const itemIcon=document.getElementById('icon-'+item.id);if(itemIcon)itemIcon.style.transform='rotate(0deg)'}});menu.classList.toggle('hidden');if(icon)icon.style.transform=menu.classList.contains('hidden')?'rotate(0deg)':'rotate(180deg)'}
        let collapsed=false;function toggleSidebar(){const sidebar=document.getElementById('sidebar');collapsed=!collapsed;sidebar.classList.toggle('w-0',collapsed);sidebar.classList.toggle('w-80',!collapsed);sidebar.classList.toggle('overflow-hidden',collapsed)}
        function toggleTheme(){document.documentElement.classList.toggle('dark');const dark=document.documentElement.classList.contains('dark');document.getElementById('themeIcon').setAttribute('data-lucide',dark?'sun':'moon');lucide.createIcons()}
        function filterTable(){const query=(document.getElementById('tableSearch').value+' '+document.getElementById('memberFilter').value).toLowerCase();document.querySelectorAll('#tableBody tr').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(query)?'':'none'})}
        function copyTable(){navigator.clipboard.writeText(Array.from(document.querySelectorAll('#tableBody tr')).map(row=>Array.from(row.cells).map(cell=>cell.textContent.trim()).join('\t')).join('\n'))}
        function exportCSV(){const headers=['Sl','Member ID','Name','Mobile','Currency','Amount','Date','Wallet'];const rows=Array.from(document.querySelectorAll('#tableBody tr')).map(row=>Array.from(row.cells).map(cell=>`"${cell.textContent.trim()}"`).join(','));const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([headers.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}));link.download='admin-credit-history.csv';link.click()}
        lucide.createIcons();
